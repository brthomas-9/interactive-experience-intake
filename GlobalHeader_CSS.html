<style>
      /* Global Header */
      .globalHeader {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 1000;
      }

      .headerContainer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 1400px;
        margin: 0 auto;
        padding: 12px 20px;
        gap: 24px;
      }

      .headerBrand {
        display: flex;
        align-items: center;
      }

      .brandLink {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: var(--ink);
      }

      .brandLink:hover .brandTitle {
        color: var(--accent);
      }

      .brandLogo {
        height: 24px;
        width: auto;
      }

      .brandText {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: 'Red Hat Display', 'Red Hat Text', ui-sans-serif, system-ui, sans-serif;
      }

      .brandDivider {
        color: var(--muted);
        font-weight: 300;
        font-size: 20px;
      }

      .brandTitle {
        font-size: 18px;
        font-weight: 700;
        transition: color 0.2s;
      }

      .headerNav {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .navItem {
        position: relative;
      }

      .navButton {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        border: none;
        background: transparent;
        color: var(--ink);
        font-size: 14px;
        font-weight: 500;
        font-family: 'Red Hat Text', ui-sans-serif, system-ui, sans-serif;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
        white-space: nowrap;
      }

      .navButton:hover {
        background: var(--border);
      }

      .navButton:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .navLink {
        text-decoration: none;
      }

      .navChevron {
        transition: transform 0.2s;
      }

      .navButton[aria-expanded="true"] .navChevron {
        transform: rotate(180deg);
      }

      .navDropdownMenu {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        min-width: 220px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: var(--shadow);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px);
        transition: opacity 0.2s, transform 0.2s, visibility 0.2s;
        z-index: 1001;
      }

      #resourcesDropdown {
        min-width: 330px;
      }

      .navDropdownMenu.show {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .navDropdownMenuRight {
        left: auto;
        right: 0;
      }

      .navDropdownItem {
        display: block;
        padding: 10px 16px;
        color: var(--ink);
        text-decoration: none;
        font-size: 14px;
        transition: background 0.15s;
      }

      .navDropdownButton {
        width: 100%;
        text-align: left;
        border: none;
        background: transparent;
        font-family: 'Red Hat Text', ui-sans-serif, system-ui, sans-serif;
        cursor: pointer;
      }

      .navDropdownItem:first-child {
        border-radius: 8px 8px 0 0;
      }

      .navDropdownItem:last-child {
        border-radius: 0 0 8px 8px;
      }

      .navDropdownItem:hover {
        background: var(--border);
      }

      .navDropdownItem:focus {
        outline: none;
        background: var(--border);
      }

      .navDropdownDivider {
        height: 1px;
        background: var(--border);
        margin: 4px 0;
      }

      .navDropdownSection {
        padding: 8px 0;
      }

      .navDropdownSection:not(:last-child) {
        border-bottom: 1px solid var(--border);
      }

      .navDropdownSectionLabel {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: var(--muted);
        padding: 4px 16px 8px 16px;
      }

      .navDropdownSection .navDropdownItem {
        padding: 11px 16px;
      }

      .navDropdownSection .navDropdownItem:first-of-type {
        border-radius: 0;
      }

      .navDropdownSection .navDropdownItem:last-of-type {
        border-radius: 0;
      }

      .navAccount {
        padding: 4px 12px 4px 4px;
        border-radius: 20px;
        background: var(--border);
        margin-left: 8px;
      }

      .accountAvatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--accent);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 14px;
        flex-shrink: 0;
      }

      .accountEmail {
        font-size: 13px;
        color: var(--ink);
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .mobileMenuToggle {
        display: none;
        width: 40px;
        height: 40px;
        padding: 8px;
        border: none;
        background: transparent;
        color: var(--ink);
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s;
      }

      .mobileMenuToggle:hover {
        background: var(--border);
      }

      .mobileMenuToggle:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .mobileOnly {
        display: none;
      }

      /* Responsive */
      @media (max-width: 1024px) {
        .accountEmail {
          display: none;
        }

        .navAccount {
          padding: 4px;
          margin-left: 4px;
        }
      }

      @media (max-width: 768px) {
        .mobileMenuToggle {
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .mobileOnly {
          display: block;
        }

        .desktopOnly {
          display: none;
        }

        .headerNav {
          position: fixed;
          top: 57px;
          right: -100%;
          width: 280px;
          max-width: 85vw;
          height: calc(100vh - 57px);
          background: var(--surface);
          border-left: 1px solid var(--border);
          box-shadow: -2px 0 8px rgba(0, 0, 0, 0.1);
          flex-direction: column;
          align-items: stretch;
          justify-content: flex-start;
          gap: 4px;
          padding: 12px;
          overflow-y: auto;
          transition: right 0.3s ease;
          z-index: 999;
        }

        .headerNav.mobileMenuOpen {
          right: 0;
        }

        .navItem,
        .navButton,
        .navLink {
          width: 100%;
          justify-content: flex-start;
        }

        .navButton {
          padding: 12px 14px;
          font-size: 14px;
          border-radius: 6px;
        }

        /* Hide dropdown toggle buttons in mobile - show sections directly */
        .navItem.navDropdown > .navButton {
          display: none;
        }

        .navDropdownMenu {
          position: static;
          width: 100%;
          opacity: 1;
          visibility: visible;
          transform: none;
          margin-bottom: 12px;
          box-shadow: none;
          border: none;
          border-radius: 0;
          padding: 0;
        }

        /* Section headers for mobile (exclude Resources which has explicit labels) */
        .navDropdownMenu:not(#resourcesDropdown)::before {
          content: attr(data-section);
          display: block;
          font-size: 11px;
          font-weight: 600;
          text-transform: uppercase;
          color: var(--muted);
          padding: 8px 0 4px 0;
          letter-spacing: 0.5px;
        }

        .navDropdownItem {
          padding: 10px 12px;
          border-radius: 6px;
          margin-bottom: 2px;
        }

        /* Account section - hide dropdown button, show user info as header */
        .navItem.navDropdown > .navButton.navAccount {
          display: flex;
          background: transparent;
          padding: 12px 0;
          margin: 0;
          border: none;
          border-top: 1px solid var(--border);
          margin-top: 12px;
          padding-top: 12px;
          pointer-events: none;
        }

        .navItem.navDropdown > .navButton.navAccount .navChevron {
          display: none;
        }

        .accountEmail {
          display: block;
          max-width: none;
        }

        .brandTitle {
          font-size: 16px;
        }
      }

      @media (max-width: 640px) {
        .headerContainer {
          padding: 10px 16px;
        }

        .headerNav {
          width: 260px;
        }

        .brandText {
          gap: 6px;
        }

        .brandTitle {
          font-size: 15px;
        }
      }
</style>
